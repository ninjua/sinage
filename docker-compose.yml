services:
  app:
    build: .
    restart: always
    environment:
      - ADMIN_PASSWORD=change-this-password
      - TZ=Europe/Athens
    volumes:
      - ./data:/app/data
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
volumes:
  caddy_data:
